# Default: truy cập trực tiếp qua IP (không khớp server_name nào)
server {
    listen 80 default_server;
    server_name _;
    root /var/www/website1;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# ---- Localtunnel (npm) public URLs ----
# Website 1: https://nmh05web1.loca.lt
server {
    listen 80;
    server_name nmh05web1.loca.lt;
    root /var/www/website1;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
}

